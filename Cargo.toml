[package]
name = "hyprgrid"
version = "0.1.0"
edition = "2024"
description = "3D workspace grid manager for Hyprland (Monitor × Row × Column)"
license = "MIT"
repository = "https://github.com/mestik78/hyprgrid"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.28"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
