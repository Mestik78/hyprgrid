# hyprgrid configuration
# Location: ~/.config/hyprgrid/config.toml

[grid]
# Number of rows (Y dimension) per monitor (1-100, default: 10)
rows = 10

# Number of columns (X dimension) per row (1-100, default: 10)
cols = 10

[monitors]
# Isolate workspaces per monitor (3D mode: Monitor × Row × Column)
# Set to false to share a single flat 2D grid across all monitors
isolate = true

# Deterministic monitor ordering (Z dimension: 0, 1, 2, ...)
# e.g. Monitor 0 gets workspaces 1..100, Monitor 1 gets 101..200
# Falls back to ~/.config/hypr/monitors_order if left empty
order = [
    "eDP-1",
    "HDMI-A-2"
]

[waybar]
# Main format string.
# Available variables: {row}, {workspaces}, {active}, {monitor}
format = " {row} {workspaces}"

# Workspace template for the active workspace.
# Available variables: {col}, {ws}, {row}
# Can use Pango markup (e.g. "<b><u>{col}</u></b>", "<span color='#89b4fa'>{col}</span>")
# or plain text (e.g. "[{col}]", "●") for pure CSS styling.
active_format = "<b><u>{col}</u></b>"

# Workspace template for occupied workspaces (inactive).
occupied_format = "<span alpha='60%'>{col}</span>"

# Separator between workspace elements in the list
separator = " "

# Show 2D workspace bounding-box grid tooltip
show_tooltip = true
